[package]
name = "supernovas"
description = "Safe Rust wrapper around the SuperNOVAS astrometry library"
keywords = ["astronomy", "astrometry", "coordinates", "novas"]
categories = ["science", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
features = ["vendored", "hifitime"]

[features]
default = []
std = ["hifitime?/std"]
hifitime = ["dep:hifitime"]
vendored = ["supernovas-ffi/vendored"]

[dependencies]
supernovas-ffi = { workspace = true }
thiserror = { version = "2", default-features = false }
approx = { version = "0.5", default-features = false }
hifitime = { version = "4", optional = true, default-features = false }

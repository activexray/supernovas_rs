[package]
name = "supernovas"
description = "Safe Rust wrapper around the SuperNOVAS astrometry library"
keywords = ["astronomy", "astrometry", "coordinates", "novas"]
categories = ["science", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
features = ["vendored", "std", "hifitime", "anise"]
# eop is intentionally excluded from docs.rs builds: it requires a system
# libcurl which is not available in the docs.rs sandbox.

[features]
default = ["anise", "vendored"]
std = ["hifitime?/std", "supernovas-ffi/libc"]
hifitime = ["dep:hifitime"]
vendored = ["supernovas-ffi/vendored"]
# Enable CALCEPH planet-ephemeris support for `Accuracy::Full` astrometry.
# Requires `std` (path-based ephemeris-file loading) and a system-installed
# libcalceph located via pkg-config.
calceph = ["std", "supernovas-ffi/calceph"]
# Pure-Rust planet-ephemeris support via the `anise` crate. Alternative to
# `calceph` — same role (provider for `Accuracy::Full`), no C dependency.
anise = ["std", "dep:anise"]
# Enables live IERS EOP data fetching via CURL (removes WITHOUT_CURL=ON from
# the vendored build) and exposes the `eop` module with Rust wrappers for
# novas_fetch_eop, polar-wobble corrections, and related utilities.
eop = ["std", "supernovas-ffi/curl"]

[dependencies]
supernovas-ffi = { workspace = true }
thiserror = { version = "2", default-features = false }
approx = { version = "0.5", default-features = false }
heapless = { version = "0.9", default-features = false }
hifitime = { version = "4", optional = true, default-features = false }
anise = { version = "0.10", optional = true }

[[example]]
name = "full_precision"
required-features = ["eop", "anise"]

[lints]
workspace = true

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix flake check

      - name: Copy coverage report to workspace
        run: |
          # The cov derivation was already built by `nix flake check` above;
          # this just resolves the cached store path without rebuilding.
          COV=$(nix build .#checks.x86_64-linux.cov --no-link --print-out-paths)
          cp "$COV/lcov.info" ./lcov.info

      - uses: codecov/codecov-action@v5
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

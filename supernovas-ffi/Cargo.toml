[package]
name = "supernovas-ffi"
description = "Raw FFI bindings to the SuperNOVAS C library"
links = "supernovas"
keywords = ["astronomy", "astrometry", "novas", "ffi", "bindings"]
categories = ["external-ffi-bindings", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
features = ["vendored"]

[features]
default = []

# Build SuperNOVAS from the bundled git submodule (vendor/supernovas, tracking v1.7.x).
# Enable this if no system supernovas >= 1.7.0 is available via pkg-config.
vendored = ["dep:cmake"]

# Expose the CALCEPH ephemeris integration symbols from SuperNOVAS.
# Also requires a system `libcalceph` at link time (CALCEPH itself is never vendored).
#
# With `vendored`: the CMake build automatically enables ENABLE_CALCEPH=ON.
# Without `vendored`: the system SuperNOVAS **must** have been compiled with
#   CALCEPH support (-DENABLE_CALCEPH=ON); otherwise linking will fail with
#   missing `solsys_calceph` / `novas_use_calceph` symbols.
calceph = []

# Only affects the `vendored` CMake build: compile SuperNOVAS with full libc
# support (stdio, stdlib, etc.).  When absent, WITHOUT_LIBC=ON is passed to
# CMake, producing a freestanding build.  Has no effect on system library builds.
# Implied by the `std` feature in the `supernovas` safe-wrapper crate.
libc = []

# Only affects the `vendored` CMake build: remove WITHOUT_CURL=ON so that the
# live EOP-fetch functions (novas_fetch_eop, novas_reset_eop, etc.) are compiled
# in.  Has no effect on system-library builds (CURL linkage there is up to the
# distro package).  Implied by the `eop` feature in the `supernovas` crate.
curl = []

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
cmake = { version = "0.1", optional = true }

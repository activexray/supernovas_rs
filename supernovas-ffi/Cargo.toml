[package]
name = "supernovas-ffi"
description = "Raw FFI bindings to the SuperNOVAS C library"
links = "supernovas"
keywords = ["astronomy", "astrometry", "novas", "ffi", "bindings"]
categories = ["external-ffi-bindings", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
features = ["vendored"]

[features]
default = []

# Build SuperNOVAS from the bundled git submodule (vendor/supernovas, pinned to v1.6.0).
# Enable this if no system supernovas >= 1.6.0 is available via pkg-config.
vendored = ["dep:cmake"]

# Wrap the CALCEPH planetary-ephemeris integration: SuperNOVAS' `novas_use_calceph`
# plus enough of CALCEPH itself (open/close, opaque handle type) to feed the
# wrapper from a file path. Requires either:
#   * a system `libcalceph` (located via pkg-config), or
#   * `--features vendored,calceph`, in which case the vendored SuperNOVAS is
#     built with `ENABLE_CALCEPH=ON` and still needs a system `libcalceph` at
#     link time (CALCEPH itself is not vendored).
calceph = []

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
cmake = { version = "0.1", optional = true }
